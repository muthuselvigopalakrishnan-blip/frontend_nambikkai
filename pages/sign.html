<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/signup.css">
    <style>

    </style>
</head>

<body>

    <!-- Navbar -->
    <header class="header">
        <div class="logo">NAMBIKKAI</div>
        <nav class="nav">
            <a href="/index.html">Home</a>
            <a href="../pages/ngo-list.html">NGO's</a>
            <a href="../pages/lawyer.html">Lawyer</a>

            <a href="../pages/bookappointment.html">Book Appointment</a>
            <a href="../pages/login.html">Login</a>
        </nav>
    </header>

    <!-- Signup Form -->
    <div class="container">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn">Create Account</button>

            <div class="switch">
                Already have an account? <a href="../pages/login.html">Login</a>
            </div>
        </form>
    </div>
</body>

</html>
